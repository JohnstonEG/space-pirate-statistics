 all. The stars have a place waiting for you.",fx:"none"},{text:"Sorry it came to this. Best of luck with the landing.",fx:"slow"}],na={speaker:aa,category:oa,lines:sa},ia="captain",ra="recovery",la=[{text:"Well now. Looks like you might be worth the oxygen after all.",fx:"none"},{text:"Better work, {name}. You've bought yourself some breathing room.",fx:"none"},{text:"Seems that trouble can be undone, given enough sense.",fx:"none"},{text:"I'd say your footing is steadier. Don't test it.",fx:"none"},{text:"Nice recovery. The crew can put away its measuring tape.",fx:"none"},{text:"Reckon you remembered which end of the pencil does the work.",fx:"none"},{text:"Keep it up, {name}. I prefer a quiet airlock.",fx:"none"},{text:"That settled a few nerves aboard. Mine included, just barely.",fx:"none"}],ca={speaker:ia,category:ra,lines:la},ha="captain",ua="sector_cleared",da=[{text:"Well done, {name}. We've put this stretch of work astern.",fx:"none"},{text:"Looks like the crew's ready to sail into rougher company.",fx:"none"},{text:"Fine sailing so far. Now let's see how you handle what's ahead.",fx:"none"},{text:"That's a chapter closed. I reckon the next won't be as easy.",fx:"none"},{text:"Good work, {name}. Don't get too comfortable with it.",fx:"none"},{text:"Seems we can leave this patch of stars behind.",fx:"none"}],pa={speaker:ha,category:ua,lines:da},ma="captain",fa="warning_1",ga=[{text:"Well now, that wasn't your finest hour. I'm keeping an eye on you.",fx:"none"},{text:"Careful, {name}. The crew has a long memory for bad calls.",fx:"none"},{text:"Seems the books have gotten a little crooked. Straighten them out.",fx:"none"},{text:"Reckon you ought to pay closer attention from here on.",fx:"none"},{text:"I don't mind a stumble, {name}. I do mind making a habit of it.",fx:"none"},{text:"That little slip has reached my desk. See that it stays little.",fx:"none"}],wa={speaker:ma,category:fa,lines:ga},ba="captain",ya="warning_2",$a=[{text:"These mistakes are addin e"},{text:"Even the ammunition feels rejected.",fx:"none"},{text:"They sail away rich. I sit here bored.",fx:"none"},{text:"Next time, {name}, let me at least threaten them!",fx:"none"},{text:"Bah. Good hunting passed us by.",fx:"none"},{text:"Someone tell gun crew to stop cheering. There is no fight.",fx:"none"},{text:"All this powder, {name}, and not one spark. Cruel universe.",fx:"none"}],Na={speaker:Ca,category:Pa,lines:Ra},La="gunner",_a="raid_lost_right_call",Oa=[{text:"Bah! We had good plan. Stars had other ideas.",fx:"none"},{text:"Bad luck today, {name}. Your call was sound.",fx:"none"},{text:"Enemy got lucky. I would take same fight again.",fx:"none"},{text:"Sometimes even straight shot finds crooked space.",fx:"none"},{text:"Ugh. Guns did what guns could. Chance did rest.",fx:"none"},{text:"Their shields held by miracle, not merit.",fx:"none"},{text:"Unlucky, {name}. I blame universe, not you.",fx:"none"},{text:"Even best captain loses toss now and then.",fx:"none"},{text:"Wind? There is no wind! Then what pushed that shot?",fx:"none"},{text:"Fine, {name}. Next target gets twice my enthusiasm.",fx:"none"}],Fa={speaker:La,category:_a,lines:Oa},Ha="gunner",qa="raid_won",Da=[{text:"Ha! Ship is ours, and guns are still warm!",fx:"shake"},{text:"Victory! Good call, {name}. I like your kind of paperwork.",fx:"slam"},{text:"Beautiful! Their captain is waving surrender with both hands.",fx:"none"},{text:"Da! {name}, cargo is coming home with us!",fx:"none"},{text:"Look at that! Even my best cannon has manners today.",fx:"none"},{text:"Glorious work. I have enough soot for whole winter.",fx:"none"},{text:"Target folded faster than cheap chair!",fx:"none"},{text:"Boom! That is sound of excellent accounting.",fx:"slam"},{text:"Excellent, {name}! I will name shell after you.",fx:"none"},{text:"Our gun crews are singing. Very badly, but singing.",fx:"none"},{text:"Quiet now. Lovely quiet after good battle.",fx:"none"},{text:"Fireworks are over. Send loaders for the cargo!",fx:"none"},{text:"Never doubt old cannons and good orders.",fx:"none"},{text:"Another prize for Starry Seas. Captain will smile, perhaps.",fx:"none"},{text:"By my guns, {name}, that was good hunting!",fx:"none"}],Ba={speaker:Ha,category:qa,lines:Da},Wa="gunner",ja="raid_wrong_call",Ua=[{text:"Blast! Captain will not enjoy report on this one.",fx:"none"},{text:"That was poor hunt, {name}. I suggest good apology.",fx:"none"},{text:"Wrong prey! Now we have scars instead of cargo.",fx:"none"},{text:"Look what you sent us into. Captain is already asking questions.",fx:"none"},{text:"Ah, splendid. We attacked trouble and trouble answered.",fx:"none"},{text:"Bad call, {name}. The captain keeps very sharp memory.",fx:"none"},{text:"Guns are tired, hull is bruised, and captain is not smiling.",fx:"none"},{text:"Perhaps next time we shoot at something less eager to shoot back.",fx:"none"},{text:"Such clever plan. Captain may frame it beside airlock.",fx:"none"},{text:"No loot, much noise. Captain will want words.",fx:"none"},{text:"Listen, {name}, captain heard every alarm.",fx:"none"},{text:"Well, I survived. Your meeting with captain may be less pleasant.",fx:"none"}],za={speaker:Wa,category:ja,lines:Ua},Ga="multiple",Ya="script_ending_ai",Va=[{speaker:"captain",text:"Well, {name}, turns out the crew can buy patience by the circuit.",fx:"none"},{speaker:"quartermaster",text:"A merchant sold us an AI. It finishes the paperwork before the ink is dry.",fx:"none"},{speaker:"captain",text:"That means you're free to leave at the next port. Don't look so wounded.",fx:"none"},{speaker:"quartermaster",text:"For what it's worth, the machine doesn't complain about my deadlines.",fx:"none"},{speaker:"captain",text:"Off you go, {name}. Reckon progress has a funny sense of humor.",fx:"none"}],Ka={speaker:Ga,category:Ya,lines:Va},Xa="multiple",Ja="script_ending_dues",Qa=[{speaker:"captain",text:"Well, {name}, you've paid your dues. More or less.",fx:"none"},{speaker:"captain",text:"You survived the work. I wouldn't call it a triumph.",fx:"none"},{speaker:"captain",text:"We'll put you ashore at the next port. No need to thank me.",fx:"none"},{speaker:"captain",text:"Try not to tell anyone where you've been. I'd hate the paperwork.",fx:"none"}],Za={speaker:Xa,category:Ja,lines:Qa},eo="multiple",to="script_ending_king",ao=[{speaker:"captain",text:"Heh... heh... I really shouldn't have eaten that imported delicacy.",fx:"tremble"},{speaker:"quartermaster",text:"The physician says it's kuru. Laughing sickness. The cook refuses to refund us.",fx:"none"},{speaker:"captain",text:"Ha... Well, it's not funny. That's the worst of it.",fx:"slow"},{speaker:"gunner",text:"Captain, you are laughing at ceiling. This is concerning.",fx:"none"},{speaker:"captain",text:"Listen here, {name}. Your calls have been right, and quick besides.",fx:"none"},{speaker:"captain",text:"I cannot say the same for that cursed supper. Ha!",fx:"tremble"},{speaker:"captain",text:"Crew elected me. Now I name you captain of the Starry Seas.",fx:"slow"},{speaker:"quartermaster",text:"For the record, I object to the succession procedure. Not the choice.",fx:"none"},{speaker:"gunner",text:"New captain! I will fire celebration cannon! Outside this time.",fx:"shake"}],oo={speaker:eo,category:to,lines:ao},so="multiple",no="script_intro",io=[{speaker:"captain",text:"Morning, {name}. Don't struggle with the chair. It bites.",fx:"slow"},{speaker:"captain",text:"You're aboard the Starry Seas. We borrowed you from that corporate freighter.",fx:"none"},{speaker:"captain",text:"We took the cargo too, mind you. Let the freighter sail on without it.",fx:"none"},{speaker:"captain",text:"Our last statistician tried hiding among that ship's crew.",fx:"none"},{speaker:"captain",text:"Found him, of course. Sent him out the airlock. Awful paperwork afterward.",fx:"none"},{speaker:"captain",text:"Then I saw 'accountant' on your badge and reckoned that was close enough.",fx:"none"},{speaker:"captain",text:"We've got ships to choose from and no time for guessing.",fx:"none"},{speaker:"gunner",text:"Captain! Mikhail played chicken with stick of dynamite. Lost hand!",fx:"crackle"},{speaker:"captain",text:"Again? I thought we locked up the dynamite.",fx:"none"},{speaker:"gunner",text:"We did! He unlocked it. Very resourceful man.",fx:"none"},{speaker:"captain",text:"Well now. I have a situation to handle. Quartermaster, take over.",fx:"none"},{speaker:"quartermaster",text:"Listen carefully, {name}. Targets appear. You read the reports and give me the numbers.",fx:"none"},{speaker:"quartermaster",text:"Those numbers tell the captain which ships are worth approaching.",fx:"none"},{speaker:"quartermaster",text:"Make good calls and you earn your keep. Make bad ones and he changes the roster.",fx:"none"},{speaker:"quartermaster",text:"Your monitors have the tables, calculator, and reference sheets. Use them.",fx:"none"},{speaker:"quartermaster",text:"First, a practice job. It doesn't count. After that, you're on the clock.",fx:"none"}],ro={speaker:so,category:no,lines:io},lo="multiple",co="script_tutorial_end_bad",ho=[{speaker:"quartermaster",text:"That was a practice job, {name}. Fortunately for you.",fx:"none"},{speaker:"quartermaster",text:"I'd recommend learning which side of the ledger is up.",fx:"none"},{speaker:"quartermaster",text:"Real work starts now. The captain won't mark it as practice.",fx:"none"}],uo={speaker:lo,category:co,lines:ho},po="multiple",mo="script_tutorial_end_good",fo=[{speaker:"quartermaster",text:"That was tolerable, {name}. A pleasant surprise.",fx:"none"},{speaker:"quartermaster",text:"At this rate, you might last a week.",fx:"none"},{speaker:"quartermaster",text:"Practice is over. Now the captain expects results.",fx:"none"}],go={speaker:po,category:mo,lines:fo},wo=[{speaker:"quartermaster",category:"case_open",lines:[{text:"New target on scope: the {ship}. Numbers, please.",fx:"none"},{text:"The {ship}. Details are on your screen. I want answers, not sighs.",fx:"none"},{text:"Another one. Work it up and report.",fx:"none"}]},{speaker:"quartermaster",category:"submission_received",lines:[{text:"Received.",fx:"none"},{text:"Noted.",fx:"none"}]},{speaker:"quartermaster",category:"step_correct",lines:[{text:"Fine. Next.",fx:"none"},{text:"That'll do.",fx:"none"},{text:"Hm.",fx:"none"}]},{speaker:"quartermaster",category:"step_wrong",lines:[{text:"For an accountant, you sure can't account.",fx:"wave"},{text:"Wrong. Read the screen before you type next time.",fx:"none"},{text:"I'll pretend I didn't see that.",fx:"none"}]},{speaker:"quartermaster",category:"time_low",lines:[{text:"What, do you need a genie in a bottle to solve this?",fx:"wave"},{text:"The ship isn't going to wait for you to finish thinking.",fx:"none"},{text:"Tick tock, accountant.",fx:"slow"}]},{speaker:"quartermaster",category:"timeout",lines:[{text:"Out of time. The captain will hear about this.",fx:"none"},{text:"Too slow. We'll manage without your numbers.",fx:"none"}]},{speaker:"quartermaster",category:"pass_ordered",lines:[{text:"Passing. Plot a new course.",fx:"none"},{text:"We let it go. Next target.",fx:"none"}]},{speaker:"gunner",category:"raid_won",lines:[{text:"Ship is ours! Good numbers, accountant. Very good.",fx:"shake"},{text:"Ha! Like shooting fish in a barrel. In space.",fx:"wave"},{text:"Cargo hold full. I like this accountant.",fx:"none"}]},{speaker:"gunner",category:"raid_lost_right_call",lines:[{text:"Bad luck. Dice hate us today.",fx:"none"},{text:"Numbers were good. Universe was not.",fx:"tremble"}]},{speaker:"gunner",category:"raid_wrong_call",lines:[{text:"You're gonna account for a beating if you keep this up.",fx:"shake"},{text:"Those numbers nearly got me killed. Captain will hear.",fx:"slam"},{text:"Next time, maybe count better. Da?",fx:"none"}]},{speaker:"gunner",category:"missed_loot",lines:[{text:"We passed that one? My guns are bored.",fx:"none"},{text:"Easy prize, and we wave goodbye. Bah.",fx:"shake"}]},{speaker:"gunner",category:"idle",lines:[{text:"Testing powder. Do not mind small explosion.",fx:"crackle"},{text:"Who took my good wrench?",fx:"none"}]},{speaker:"captain",category:"warning_1",lines:[{text:"I'm keeping an eye on your numbers, accountant.",fx:"slow"},{text:"That's a few too many slips for my liking.",fx:"none"}]},{speaker:"captain",category:"warning_2",lines:[{text:"The airlock's been feeling lonely lately. Don't give it company.",fx:"slow"},{text:"I reckon you know what happens to statisticians who miss.",fx:"none"}]},{speaker:"captain",category:"warning_final",lines:[{text:"This is your last chance before you become a star in the sea of space.",fx:"slow"}]},{speaker:"captain",category:"recovery",lines:[{text:"Well now. Maybe you're worth the oxygen after all.",fx:"none"},{text:"Better. Don't let it go to your head.",fx:"none"}]},{speaker:"captain",category:"sector_cleared",lines:[{text:"Sector's picked clean. Rougher waters ahead.",fx:"none"},{text:"Good haul. Don't get comfortable.",fx:"none"}]},{speaker:"captain",category:"overboard",lines:[{text:"Afraid this is where we part ways. Enjoy the view.",fx:"slow"},{text:"You had a good run. Short, but good. Airlock's that way.",fx:"slow"}]},{speaker:"multiple",category:"script_intro",lines:[{speaker:"captain",text:"Morning, sunshine. Easy now, you took a knock.",fx:"slow"},{speaker:"captain",text:"We picked you up off that freighter we raided. Nice ship. Nicer now that it's lighter.",fx:"none"},{speaker:"captain",text:"Our last statistician tried to hide among your crew while we were aboard. He's out there now, somewhere.",fx:"none"},{speaker:"captain",text:"You're an accountant. I reckon that's close enough.",fx:"wave"},{speaker:"gunner",text:"Captain! Pavel played chicken with dynamite again! Hand is gone!",fx:"crackle"},{speaker:"captain",text:"Every week. Quartermaster, explain the job to our new hire.",fx:"none"},{speaker:"quartermaster",text:"Simple. Ships come in, I need numbers, the numbers decide whether we raid.",fx:"none"},{speaker:"quartermaster",text:"Tables on the left, calculator in the middle, rules on the right. Answers go on the top screen.",fx:"none"},{speaker:"quartermaster",text:"Wrong numbers get people hurt. The captain doesn't keep people who get people hurt.",fx:"none"},{speaker:"quartermaster",text:"First one's practice. It doesn't count. Try not to embarrass yourself.",fx:"none"}]},{speaker:"quartermaster",category:"script_tutorial_end_good",lines:[{text:"Not bad. You might last a week.",fx:"none"},{text:"Real jobs from here on.",fx:"none"}]},{speaker:"quartermaster",category:"script_tutorial_end_bad",lines:[{text:"That was practice. I'd start praying it was an off day.",fx:"none"},{text:"Real jobs from here on.",fx:"none"}]},{speaker:"multiple",category:"script_ending_king",lines:[{speaker:"quartermaster",text:"Captain. The crew voted.",fx:"none"},{speaker:"gunner",text:"Accountant made us rich! Accountant is king!",fx:"shake"},{speaker:"captain",text:"Well. I reckon I know when I'm outvoted. The ship's yours, your majesty.",fx:"slow"}]},{speaker:"multiple",category:"script_ending_dues",lines:[{speaker:"captain",text:"You kept breathing and you kept counting. That's about all I can say.",fx:"none"},{speaker:"captain",text:"Dues are paid. Next port, you're off my ship.",fx:"none"}]},{speaker:"multiple",category:"script_ending_ai",lines:[{speaker:"quartermaster",text:"We bought an AI at the last port. It's faster than you.",fx:"none"},{speaker:"captain",text:"No hard feelings. You're free to go. Next port.",fx:"wave"}]},{speaker:"quartermaster",category:"minor_open",lines:[{text:"Minor question. Nobody goes overboard for this one. The captain will love it, though.",fx:"none"},{text:"Side job, {name}. No risk to your neck. Still timed.",fx:"none"}]},{speaker:"quartermaster",category:"minor_wrong",lines:[{text:"Wrong, but it was only a game. Lucky you.",fx:"none"},{text:"Missed it. Nobody's counting this one. Except me.",fx:"wave"}]},{speaker:"captain",category:"minor_right",lines:[{text:"Ha! Now that's the kind of number I like to hear.",fx:"wave"},{text:"Well done, {name}. I'll remember that one.",fx:"none"}]},{speaker:"quartermaster",category:"target_swapped",lines:[{text:"That target slipped away while you were off duty. No matter. Another of the same sort just came up on scope."},{text:"Welcome back, {name}. The last one got away. Fresh target, same job. Your answers so far still stand."},{text:"Scope lost the old target. New one, same kind of work. The clock picks up where you left it."}]},{speaker:"multiple",category:"script_articles",lines:[{speaker:"quartermaster",text:"Before you touch a single number, {name}: the ship's articles. Sign them, or the contract says you leave by the airlock."},{speaker:"captain",text:"Pirates are mighty fond of rules. Long as we're the ones who wrote 'em."}]}],bo="quartermaster",yo="case_open",$o=[{text:"Contact: {ship}. I need a clean report before the captain gets impatient.",fx:"none"},{text:"New target on scope, {name}. Open its dossier and get me something useful.",fx:"none"},{text:"Incoming vessel, {ship}. The bridge wants your assessment.",fx:"none"},{text:"Scanner picked up {ship}. Read the intelligence before you decide anything.",fx:"none"},{text:"Merchant traffic ahead. Don't give me a guess dressed as a report.",fx:"none"},{text:"Eyes on the request monitor, {name}. We've got another candidate.",fx:"none"},{text:"Bridge has flagged {ship}. Work through the details.",fx:"none"},{text:"There's a ship crossing our bow. Find out whether it's worth our attention.",fx:"none"},{text:"Another hull, another set of decisions. Start with the dossier.",fx:"none"},{text:"Target acquired. I'd prefer facts to enthusiasm.",fx:"none"},{text:"Registry says {ship}. Let's see if that means anything useful.",fx:"none"},{text:"Someone out there has cargo. Prove whether we ought to care.",fx:"none"},{text:"Fresh work, {name}. The captain wants a recommendation, not poetry.",fx:"none"},{text:"Unidentified contact resolved as {ship}. Your assignment is ready.",fx:"none"},{text:"Before the gunner starts celebrating, {name}, check the evidence on this one.",fx:"none"}],ko={speaker:bo,category:yo,lines:$o},vo="quartermaster",xo="minor_open",To=[{text:"Side business: a wager. It's timed, but nobody's going out the airlock over it.",fx:"none"},{text:"The crew has made a silly bet. Indulge them; the captain loves a winner. Clock's running.",fx:"none"},{text:"Small diversion, {name}. No danger attached, but the captain will be delighted if you get it.",fx:"none"},{text:"There's an argument at the mess table. Settle it quickly; the captain's listening.",fx:"none"},{text:"Before we get back to raiding, a harmless contest. The clock still applies.",fx:"none"},{text:"Entertainment request. Nobody gets punished; a good answer may earn you the captain's favor.",fx:"none"},{text:"Apparently the crew needs a referee. This is timed, not a trial.",fx:"none"},{text:"Wager on deck, {name}. Miss it and you keep your oxygen. Win and the captain grins.",fx:"none"},{text:"An unofficial assignment has arrived. No danger, just a ticking clock and the captain's pride.",fx:"none"},{text:"Captain's amusement is at stake, {name}. Your life isn't. Begin.",fx:"none"}],So={speaker:vo,category:xo,lines:To},Ao="quartermaster",Eo="minor_wrong",Io=[{text:"No harm done. Apart from the captain's wounded pride.",fx:"none"},{text:"Missed it, {name}. Lucky for you, this wasn't on the duty roster.",fx:"none"},{text:"Well, the crew will find another fool to bet against.",fx:"none"},{text:"At least this one can't send you out the airlock.",fx:"none"},{text:"Never mind. I won't tell the captain how confidently you answered.",fx:"none"},{text:"That wager died quietly. So will the paperwork.",fx:"none"},{text:"Consider it a free lesson, {name}. Rare commodity here.",fx:"none"},{text:"Better luck next time. Yes, I know how that sounds.",fx:"none"}],Mo={speaker:Ao,category:Eo,lines:Io},Co="quartermaster",Po="pass_ordered",Ro=[{text:"Passing it by. I'll tell the bridge.",fx:"none"},{text:"Understood, {name}. No engagement.",fx:"none"},{text:"Let it go. Filed.",fx:"none"},{text:"Raid declined. The gunner can sulk.",fx:"none"},{text:"Orders sent. We keep moving.",fx:"none"},{text:"Another peaceful passage. How dull.",fx:"none"},{text:"Very well, {name}. The guns stay quiet.",fx:"none"},{text:"Noted. The target is no longer our concern.",fx:"none"}],No={speaker:Co,category:Po,lines:Ro},Lo="quartermaster",_o="step_correct",Oo=[{text:"Fine. Next.",fx:"none"},{text:"Accepted. Keep moving.",fx:"none"},{text:"That will do, {name}.",fx:"none"},{text:"Correct. Don't look so surprised.",fx:"none"},{text:"Onward. There's more work.",fx:"none"},{text:"Adequate. A rare pleasure.",fx:"none"},{text:"Recorded as sound. Continue.",fx:"none"},{text:"Good. The captain can wait for the celebration.",fx:"none"},{text:"Right answer, {name}. Don't frame it.",fx:"none"},{text:"Clean entry, {name}. More like that.",fx:"none"},{text:"At last, something I can file.",fx:"none"},{text:"Nothing to correct. How refreshing.",fx:"none"},{text:"Proceed, {name}. That one holds.",fx:"none"},{text:"Works for me. Barely.",fx:"none"},{text:"See? The desk isn't cursed.",fx:"none"}],Fo={speaker:Lo,category:_o,lines:Oo},Ho="quartermaster",qo="step_wrong",Do=[{text:"For an accountant, you sure can't account.",fx:"wave"},{text:"Incorrect, {name}. The numbers object.",fx:"none"},{text:"That answer would sink us at the dock.",fx:"none"},{text:"Try checking the work before the captain checks the airlock.",fx:"none"},{text:"Wonderful. You've invented a new kind of wrong.",fx:"none"},{text:"Unfortunately, arithmetic remains stubborn.",fx:"none"},{text:"Your pencil seems to be negotiating with reality.",fx:"none"},{text:"Even the scanner looks disappointed.",fx:"none"},{text:"I'd send that back, but the void has no return address.",fx:"none"},{text:"Please don't make that mistake a family tradition, {name}.",fx:"none"},{text:"Somewhere, a ledger has just burst into flames.",fx:"none"},{text:"Listen, {name}. The books aren't an opinion poll.",fx:"none"},{text:"Remarkable confidence for such a poor result.",fx:"none"},{text:"Next time, read what I asked instead of what you wished I'd asked.",fx:"none"},{text:"Clearly, {name}, that was an ambitious guess.",fx:"none"}],Bo={speaker:Ho,category:qo,lines:Do},Wo="quartermaster",jo="submission_received",Uo=[{text:"Received. Don't make me regret reading it.",fx:"none"},{text:"Logged. The record is updated.",fx:"none"},{text:"Filed. That part is done.",fx:"none"},{text:"Noted, {name}. Keep going.",fx:"none"},{text:"Entered. I'll handle the rest.",fx:"none"},{text:"That's on record. Next item.",fx:"none"},{text:"Submission acknowledged. Nothing more to add.",fx:"none"},{text:"I have it, {name}. Proceed.",fx:"none"},{text:"The books are updated. Continue.",fx:"none"},{text:"Very well, {name}. It's in the ledger.",fx:"none"}],zo={speaker:Wo,category:jo,lines:Uo},Go="quartermaster",Yo="target_swapped",Vo=[{text:"While you were away, our target slipped out of range. Here's another.",fx:"none"},{text:"That freighter didn't wait, {name}. This one might.",fx:"none"},{text:"Rest acknowledged. The old contact is gone; a new one's on scope.",fx:"none"},{text:"Apparently merchant ships don't stop when our accountant does.",fx:"wave"},{text:"Good, you're back. The last ship left without asking permission.",fx:"none"},{text:"New contact. I trust your chair was comfortable during the intermission.",fx:"none"},{text:"Break's over, {name}. Fresh dossier on your monitor.",fx:"none"},{text:"Our previous guest continued its journey. Rude, but understandable.",fx:"none"},{text:"Seems the universe carried on without us, {name}. Here's the next vessel.",fx:"none"},{text:"Welcome back. We lost the ship, not the paperwork.",fx:"none"},{text:"Traffic doesn't take recess, {name}. I've found a replacement target.",fx:"none"},{text:"Sorry, that
